name: golangci-lint
on:
  push:
    branches:
      - main
      - release*
  pull_request:
    branches:
      - main
      - release*
      - feature/**

jobs:
  golangci:
    strategy:
      matrix:
        go-version: [ "1.26.x", "1.27.x" ]
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint 只支持不高于编译它自身的 Go 版本，不要使用 latest，
          # 升级 Go 时需同步确认所选版本的 built with 版本。
          version: v2.11.4
          args: --timeout=30m
