name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Release polaris
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Build
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          echo "version is $VERSION"
          bash build.sh $VERSION
          echo "name=$(ls polaris-controller-release*.zip | sed -n '1p')" >> "$GITHUB_OUTPUT"
          echo "name1=$(ls polaris-controller-release*.zip | sed -n '2p')" >> "$GITHUB_OUTPUT"

      - name: Upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./${{ steps.build.outputs.name }}
            ./${{ steps.build.outputs.name1 }}
